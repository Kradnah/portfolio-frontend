server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # www -> dominio raiz
    if ($host = www.julian-lizcano.com) {
        return 301 https://julian-lizcano.com$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # APK de rideapp y su manifiesto: carpeta del VPS montada por Dokploy (scripts/publish-apks.sh).
    location ^~ /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        location ~ \.apk$ {
            add_header Content-Disposition "attachment";
            add_header Cache-Control "public, max-age=86400";
        }
        location ~ \.json$ {
            add_header Cache-Control "no-cache";
        }
    }

    # Código exportado para el visor /codigo (scripts/export-code.mjs): texto plano, sin fallback a la SPA.
    location ^~ /code/ {
        types {
            application/json json;
            text/plain txt;
        }
        default_type text/plain;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Video de presentación (/intro): subtítulos con su tipo (con nosniff, Firefox los ignora si no)
    # y cache corto porque los nombres no llevan hash. nginx sirve rangos para adelantar el video.
    location ^~ /intro/ {
        types {
            video/mp4 mp4;
            text/vtt vtt;
            image/webp webp;
        }
        charset_types text/vtt;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri /index.html;
    }

    # Assets con hash: cache largo
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        # Sin $uri/: una carpeta de public/ no debe tapar una ruta de la app (p. ej. /demos/...).
        try_files $uri /index.html;
    }
}
