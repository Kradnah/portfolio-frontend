<div class="page">

  <!-- ─── NAVBAR (top, sobre fondo grid) ─── -->
  <nav class="navbar">
    <ul class="nav-tabs">
      <li><a href="#">Home</a></li>
      <li><a href="#">Collection</a></li>
      <li><a href="#">Service</a></li>
      <li><a href="#">About Us</a></li>
    </ul>
    <button class="nav-btn" (click)="goToLogin()">Register</button>
  </nav>

  <!-- ─── ESCENA HERO (composición en capas) ─── -->
  <section class="scene">

    <!-- ░░░ BANNER VERTICAL IZQUIERDO (lime + tag punta inferior) ░░░ -->
    <div class="brand-tag">
      <div class="brand-tag-inner">
        <div class="brand-vtext">Julian<br>Lizcano</div>

        <div class="brand-x-cluster">
          <span class="xm">×</span>
          <span class="xm">×</span>
          <span class="xm">×</span>
          <span class="xm">×</span>
        </div>

        <div class="brand-diamond">
          <svg viewBox="0 0 100 120" fill="none" stroke="black" stroke-width="1.4">
            <polygon points="50,4 92,29 92,91 50,116 8,91 8,29"/>
            <line x1="8"  y1="29"  x2="92" y2="29"/>
            <line x1="8"  y1="91"  x2="92" y2="91"/>
            <line x1="50" y1="4"   x2="50" y2="60"/>
            <line x1="8"  y1="29"  x2="50" y2="60"/>
            <line x1="92" y1="29"  x2="50" y2="60"/>
            <line x1="8"  y1="91"  x2="50" y2="60"/>
            <line x1="92" y1="91"  x2="50" y2="60"/>
            <line x1="50" y1="116" x2="50" y2="60"/>
          </svg>
        </div>
      </div>
      <!-- Punta triangular inferior del tag -->
      <div class="brand-tag-tip"></div>
    </div>

    <!-- ░░░ PANEL CENTRAL VERDE LIMA (hero principal) ░░░ -->
    <div class="hero-panel">

      <!-- Decoración esquina superior izquierda: rayas diagonales -->
      <div class="hp-stripes"></div>

      <!-- Sparkles dispersos arriba -->
      <svg class="sp sp-a" viewBox="0 0 24 24" fill="black">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
      <svg class="sp sp-b" viewBox="0 0 24 24" fill="black">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
      <svg class="sp sp-c" viewBox="0 0 24 24" fill="black">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>

      <!-- Pequeño cuadrado pink decorativo cerca del headline -->
      <div class="hp-pink-square"></div>

      <!-- Punta de flechas decorativa -->
      <div class="hp-arrows">►►►►</div>

      <!-- Headline -->
      <div class="hp-headline">
        <h1 class="h-just">Portfolio</h1>
        <div class="h-come-bg">
          <h1 class="h-come">En Progreso</h1>
        </div>
      </div>

      <!-- Body text -->
      <p class="hp-body">
        Consectetuer adipiscing elit, sed diam<br>
        nonummy nibh euismod tincidunt ut lao-<br>
        reet dolore magna.volutpat.
      </p>

      <!-- X marks fila inferior + triángulos abajo derecha -->
      <div class="hp-x-row">
        <span class="xm">×</span>
        <span class="xm">×</span>
        <span class="xm">×</span>
        <span class="xm">×</span>
      </div>
      <div class="hp-down-tri">▼<br>▼<br>▼</div>

      <!-- Botón Visit Now (esquina inferior izquierda del panel) -->
      <button class="visit-btn" (click)="goToLogin()">Visit Now</button>
    </div>

    <!-- ░░░ ZONA DERECHA (hexágono 3D + decoraciones) ░░░ -->
    <div class="right-zone">

      <!-- Círculos concéntricos arriba derecha -->
      <div class="circles">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- X marks superior -->
      <div class="rt-xrow">
        <span class="xm">×</span>
        <span class="xm">×</span>
        <span class="xm">×</span>
        <span class="xm">×</span>
      </div>

      <!-- Hexágono 3D principal (cubo isométrico gris con sombra) -->
      <div class="hex3d">
        <svg viewBox="0 0 200 200" fill="none">
          <!-- Sombra negra desplazada -->
          <polygon points="100,22 178,68 178,132 100,178 22,132 22,68"
                   fill="#000" transform="translate(10, 10)"/>
          <!-- Hexágono principal (silueta de cubo isométrico) -->
          <polygon points="100,22 178,68 178,132 100,178 22,132 22,68"
                   fill="#C9C9C9" stroke="#000" stroke-width="3"/>
          <!-- 3 aristas internas que forman la "Y" del cubo isométrico -->
          <line x1="100" y1="100" x2="100" y2="22"  stroke="#000" stroke-width="2.5"/>
          <line x1="100" y1="100" x2="178" y2="132" stroke="#000" stroke-width="2.5"/>
          <line x1="100" y1="100" x2="22"  y2="132" stroke="#000" stroke-width="2.5"/>
        </svg>
      </div>

      <!-- Sparkle "explosión" cerca del hexágono -->
      <svg class="rt-burst" viewBox="0 0 60 60" fill="none" stroke="black" stroke-width="1.2">
        <line x1="30" y1="0"  x2="30" y2="60"/>
        <line x1="0"  y1="30" x2="60" y2="30"/>
        <line x1="6"  y1="6"  x2="54" y2="54"/>
        <line x1="54" y1="6"  x2="6"  y2="54"/>
        <line x1="30" y1="10" x2="30" y2="50"/>
        <line x1="10" y1="30" x2="50" y2="30"/>
      </svg>

      <!-- Diamante wireframe pequeño abajo derecha -->
      <div class="rt-mini-diamond">
        <svg viewBox="0 0 60 72" fill="none" stroke="black" stroke-width="1.4">
          <polygon points="30,3 56,18 56,54 30,69 4,54 4,18"/>
          <line x1="4"  y1="18" x2="56" y2="18"/>
          <line x1="4"  y1="54" x2="56" y2="54"/>
          <line x1="30" y1="3"  x2="30" y2="36"/>
          <line x1="4"  y1="18" x2="30" y2="36"/>
          <line x1="56" y1="18" x2="30" y2="36"/>
          <line x1="4"  y1="54" x2="30" y2="36"/>
          <line x1="56" y1="54" x2="30" y2="36"/>
          <line x1="30" y1="69" x2="30" y2="36"/>
        </svg>
      </div>
    </div>

    <!-- ░░░ ELEMENTOS DE FONDO (rectángulos azul, pink, etc.) ░░░ -->
    <div class="bg-blue-tall"></div>
    <div class="bg-pink-bot-left"></div>
    <div class="bg-stripes-bot"></div>
    <div class="bg-black-bot-right">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- Sparkles azules grandes esquina inferior izquierda -->
    <div class="bl-sparkles">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 0L13.8 10.2L24 12L13.8 13.8L12 24L10.2 13.8L0 12L10.2 10.2Z"/>
      </svg>
    </div>

    <!-- Punto decorativo grid abajo (4x4) -->
    <div class="dot-grid">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

  </section>

</div>
